name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage the first npm package or complete a release
        required: true
        default: release
        type: choice
        options:
          - release
          - stage-first-release
      confirmation:
        description: Type RELEASE to tag and publish the package
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-svelix
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      notes_file: ${{ steps.release.outputs.notes_file }}
      release_mode: ${{ steps.release.outputs.release_mode }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version, tag, and main ancestry
        id: release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          RELEASE_MODE: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node --print "require('./package.json').name")"
          repository_url="$(node --print "require('./package.json').repository.url")"
          version="$(node --print "require('./package.json').version")"
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$package_name" != "svelix" ]]; then
            echo "::error::Expected package name svelix, received $package_name"
            exit 1
          fi

          if [[ "$repository_url" != "git+https://github.com/Saku0512/Svelix.git" ]]; then
            echo "::error::package.json repository URL does not match the trusted GitHub repository"
            exit 1
          fi

          if [[ ! "$version" =~ $stable_semver ]]; then
            echo "::error::Release workflow only accepts stable MAJOR.MINOR.PATCH versions, received $version"
            exit 1
          fi

          tag="v${version}"
          notes_file="docs/releases/${tag}.md"
          source_sha="$(git rev-parse HEAD)"
          release_mode="$RELEASE_MODE"
          if [[ -z "$release_mode" ]]; then release_mode="release"; fi

          if [[ ! -f "$notes_file" ]]; then
            echo "::error::Missing release notes: $notes_file"
            exit 1
          fi

          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --tags origin

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$CONFIRMATION" != "RELEASE" ]]; then
              echo "::error::Manual releases require confirmation value RELEASE"
              exit 1
            fi

            if [[ "$GIT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run from main, received $GIT_REF"
              exit 1
            fi

            if [[ "$source_sha" != "$(git rev-parse origin/main)" ]]; then
              echo "::error::The selected revision is not the current origin/main tip"
              exit 1
            fi

            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              tag_sha="$(git rev-list -n 1 "$tag")"
              if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
                echo "::error::Existing tag $tag does not point to a commit contained in main"
                exit 1
              fi
              tag_version="$(git show "${tag}:package.json" | node -e "let input='';process.stdin.on('data',chunk=>input+=chunk);process.stdin.on('end',()=>process.stdout.write(JSON.parse(input).version))")"
              if [[ "$tag_version" != "$version" ]]; then
                echo "::error::Existing tag $tag contains package version $tag_version instead of $version"
                exit 1
              fi
              if ! git cat-file -e "${tag}:${notes_file}"; then
                echo "::error::Existing tag $tag does not contain $notes_file"
                exit 1
              fi
              source_sha="$tag_sha"
            fi
          else
            if [[ "$GIT_REF_NAME" != "$tag" ]]; then
              echo "::error::Git tag $GIT_REF_NAME does not match package version $version"
              exit 1
            fi

            if ! git merge-base --is-ancestor "$source_sha" origin/main; then
              echo "::error::Tag $tag does not point to a commit contained in main"
              exit 1
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$source_sha" ]]; then
              echo "::error::Existing tag $tag points to $tag_sha instead of $source_sha"
              exit 1
            fi
          fi

          {
            echo "package_name=$package_name"
            echo "version=$version"
            echo "tag=$tag"
            echo "source_sha=$source_sha"
            echo "notes_file=$notes_file"
            echo "release_mode=$release_mode"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      archive_filename: ${{ steps.archive.outputs.archive_filename }}
      package_integrity: ${{ steps.archive.outputs.package_integrity }}
      package_shasum: ${{ steps.archive.outputs.package_shasum }}
      package_sha256: ${{ steps.archive.outputs.package_sha256 }}
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Svelte and TypeScript
        run: npm run check

      - name: Build distributable package
        run: npm run build

      - name: Run release test suite
        run: npm test

      - name: Verify clean and reproducible package build
        run: npm run test:package:clean

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build and record release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="$RUNNER_TEMP/release-package"
          pack_json="$archive_dir/npm-pack.json"
          mkdir -p "$archive_dir"
          npm pack --json --ignore-scripts --pack-destination "$archive_dir" > "$pack_json"

          archive_filename="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const entry=Array.isArray(data)?data[0]:data[Object.keys(data)[0]];process.stdout.write(entry.filename)" "$pack_json")"
          package_integrity="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const entry=Array.isArray(data)?data[0]:data[Object.keys(data)[0]];process.stdout.write(entry.integrity)" "$pack_json")"
          package_shasum="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const entry=Array.isArray(data)?data[0]:data[Object.keys(data)[0]];process.stdout.write(entry.shasum)" "$pack_json")"
          (
            cd "$archive_dir"
            sha256sum "$archive_filename" > "$archive_filename.sha256"
          )
          package_sha256="$(cut -d ' ' -f 1 "$archive_dir/$archive_filename.sha256")"

          {
            echo "archive_filename=$archive_filename"
            echo "package_integrity=$package_integrity"
            echo "package_shasum=$package_shasum"
            echo "package_sha256=$package_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact release archive in a consumer
        env:
          SVELIX_PACKAGE_METADATA: ${{ runner.temp }}/release-package/npm-pack.json
          SVELIX_PACKAGE_TARBALL: ${{ runner.temp }}/release-package/${{ steps.archive.outputs.archive_filename }}
        run: npm run test:package

      - name: Retain verified release archive
        uses: actions/upload-artifact@v7
        with:
          name: svelix-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Tag and publish release
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/svelix/v/${{ needs.prepare.outputs.version }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Check out current release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false

      - name: Set up Node.js 24 LTS and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm release-command support
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 15)) { console.error('npm 11.15.0 or newer is required for staged and trusted publishing'); process.exit(1); }" "$npm_version"

      - name: Download verified release archive
        uses: actions/download-artifact@v8
        with:
          name: svelix-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release-package

      - name: Verify transferred release archive
        env:
          ARCHIVE_FILENAME: ${{ needs.verify.outputs.archive_filename }}
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.package_integrity }}
          EXPECTED_SHASUM: ${{ needs.verify.outputs.package_shasum }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="$RUNNER_TEMP/release-package"
          tarball="$archive_dir/$ARCHIVE_FILENAME"
          metadata="$archive_dir/npm-pack.json"
          (
            cd "$archive_dir"
            sha256sum --check "$ARCHIVE_FILENAME.sha256"
          )
          actual_shasum="$(sha1sum "$tarball" | cut -d ' ' -f 1)"
          actual_sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          actual_integrity="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const entry=Array.isArray(data)?data[0]:data[Object.keys(data)[0]];process.stdout.write(entry.integrity)" "$metadata")"

          if [[ "$actual_shasum" != "$EXPECTED_SHASUM" ]]; then
            echo "::error::Transferred package SHA-1 does not match the verified archive"
            exit 1
          fi
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Transferred package SHA-256 does not match the verified archive"
            exit 1
          fi
          if [[ "$actual_integrity" != "$EXPECTED_INTEGRITY" ]]; then
            echo "::error::Transferred package integrity does not match the verified archive"
            exit 1
          fi

      - name: Plan npm publication without changing registry state
        id: npm_plan
        env:
          LOCAL_INTEGRITY: ${{ needs.verify.outputs.package_integrity }}
          LOCAL_SHASUM: ${{ needs.verify.outputs.package_shasum }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PROVENANCE_IDENTITY_SHA: ${{ github.sha }}
          RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
        shell: bash
        run: |
          set -euo pipefail

          package_error_file="$RUNNER_TEMP/npm-package-error.log"
          set +e
          package_json="$(npm view "$PACKAGE_NAME" name --json 2> "$package_error_file")"
          package_status=$?
          set -e
          if [[ $package_status -eq 0 ]]; then
            registry_name="$(node -e "process.stdout.write(JSON.parse(process.argv[1]))" "$package_json")"
            if [[ "$registry_name" != "$PACKAGE_NAME" ]]; then
              echo "::error::npm package lookup returned $registry_name instead of $PACKAGE_NAME"
              exit 1
            fi
            package_state="present"
          else
            package_error="$(<"$package_error_file")"
            if [[ "$package_error" == *"E404"* || "$package_json" == *"E404"* ]]; then
              package_state="absent"
            else
              printf '%s\n%s\n' "$package_error" "$package_json" >&2
              exit "$package_status"
            fi
          fi

          latest_error_file="$RUNNER_TEMP/npm-latest-error.log"
          set +e
          latest_json="$(npm view "${PACKAGE_NAME}@latest" version --json 2> "$latest_error_file")"
          latest_status=$?
          set -e
          if [[ $latest_status -eq 0 ]]; then
            latest_version="$(node -e "process.stdout.write(JSON.parse(process.argv[1]))" "$latest_json")"
          else
            latest_error="$(<"$latest_error_file")"
            if [[ "$latest_error" == *"E404"* || "$latest_json" == *"E404"* ]]; then
              latest_version=""
            else
              printf '%s\n%s\n' "$latest_error" "$latest_json" >&2
              exit "$latest_status"
            fi
          fi

          candidate_error_file="$RUNNER_TEMP/npm-candidate-error.log"
          set +e
          candidate_json="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.integrity --json 2> "$candidate_error_file")"
          candidate_status=$?
          set -e
          if [[ $candidate_status -eq 0 ]]; then
            candidate_integrity="$(node -e "process.stdout.write(JSON.parse(process.argv[1]))" "$candidate_json")"
            publication_state="published"
            if [[ "$candidate_integrity" == "$LOCAL_INTEGRITY" ]]; then
              integrity_state="match"
            else
              integrity_state="mismatch"
            fi
          else
            candidate_error="$(<"$candidate_error_file")"
            if [[ "$candidate_error" == *"E404"* || "$candidate_json" == *"E404"* ]]; then
              publication_state="unpublished"
              integrity_state="mismatch"
            else
              printf '%s\n%s\n' "$candidate_error" "$candidate_json" >&2
              exit "$candidate_status"
            fi
          fi

          candidate_stage="none"
          stage_id=""
          if [[ "$RELEASE_MODE" == "stage-first-release" ]]; then
            if [[ -z "$NPM_BOOTSTRAP_TOKEN" ]]; then
              echo "::error::stage-first-release requires the npm Environment secret NPM_TOKEN"
              exit 1
            fi

            stage_file="$RUNNER_TEMP/npm-stage-list.json"
            NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm stage list "$PACKAGE_NAME" --json > "$stage_file"
            stage_result="$(node .release-automation/scripts/release-policy.mjs stage-state "$stage_file" "$PACKAGE_NAME" "$PACKAGE_VERSION" "$LOCAL_SHASUM")"
            candidate_stage="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).state)" "$stage_result")"
            stage_id="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).stageId)" "$stage_result")"
          fi

          latest_argument="$latest_version"
          if [[ -z "$latest_argument" ]]; then latest_argument="-"; fi
          plan="$(node .release-automation/scripts/release-policy.mjs plan "$PACKAGE_VERSION" "$latest_argument" "$package_state" "$publication_state" "$integrity_state" "$candidate_stage" "$RELEASE_MODE")"
          provenance="$(node .release-automation/scripts/release-policy.mjs provenance "$plan" "$PACKAGE_SOURCE_SHA" "$PROVENANCE_IDENTITY_SHA")"

          {
            echo "candidate_stage=$candidate_stage"
            echo "latest_version=$latest_version"
            echo "package_state=$package_state"
            echo "plan=$plan"
            echo "provenance=$provenance"
            echo "stage_id=$stage_id"
          } >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable release tag
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG points to $tag_sha instead of $EXPECTED_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$EXPECTED_SHA" --message "Svelix $RELEASE_TAG"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Stage, publish, or resume package
        id: npm_action
        env:
          ARCHIVE_FILENAME: ${{ needs.verify.outputs.archive_filename }}
          EXISTING_STAGE_ID: ${{ steps.npm_plan.outputs.stage_id }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLICATION_PLAN: ${{ steps.npm_plan.outputs.plan }}
          PROVENANCE_PLAN: ${{ steps.npm_plan.outputs.provenance }}
        shell: bash
        run: |
          set -euo pipefail

          tarball="$RUNNER_TEMP/release-package/$ARCHIVE_FILENAME"
          stage_id=""
          if [[ "$PUBLICATION_PLAN" == "stage" ]]; then
            if [[ -z "$NPM_BOOTSTRAP_TOKEN" ]]; then
              echo "::error::stage-first-release requires the npm Environment secret NPM_TOKEN"
              exit 1
            fi

            stage_args=(stage publish "$tarball" --access public --tag latest --json)
            if [[ "$PROVENANCE_PLAN" == "generate" ]]; then
              stage_args+=(--provenance)
            elif [[ "$PROVENANCE_PLAN" == "omit-bootstrap-recovery" ]]; then
              echo "::warning::Omitting provenance because the immutable package source differs from the workflow identity commit"
            else
              echo "::error::Unexpected provenance plan for staging: $PROVENANCE_PLAN"
              exit 1
            fi

            stage_json="$(NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm "${stage_args[@]}")"
            printf '%s\n' "$stage_json"
            stage_id="$(node -e "const data=JSON.parse(process.argv[1]);const entry=data.stageId?data:data[Object.keys(data)[0]];process.stdout.write(entry?.stageId??'')" "$stage_json")"
            if [[ -z "$stage_id" ]]; then
              echo "::error::npm stage publish did not return a stage ID"
              exit 1
            fi
          elif [[ "$PUBLICATION_PLAN" == "await-approval" ]]; then
            if [[ -z "$EXISTING_STAGE_ID" ]]; then
              echo "::error::A matching pending stage must include its stage ID"
              exit 1
            fi
            stage_id="$EXISTING_STAGE_ID"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already staged as $stage_id; waiting for maintainer approval."
          elif [[ "$PUBLICATION_PLAN" == "publish" ]]; then
            if [[ "$PROVENANCE_PLAN" != "generate" ]]; then
              echo "::error::Direct publication requires provenance tied to the package source commit"
              exit 1
            fi
            if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
              NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm publish "$tarball" --access public --tag latest --provenance
            else
              npm publish "$tarball" --access public --tag latest --provenance
            fi
          elif [[ "$PUBLICATION_PLAN" == "resume" ]]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published, verified, and latest; resuming release."
          else
            echo "::error::Unknown publication plan: $PUBLICATION_PLAN"
            exit 1
          fi

          if [[ "$PUBLICATION_PLAN" == "publish" || "$PUBLICATION_PLAN" == "resume" ]]; then
            latest_version="$(npm view "${PACKAGE_NAME}@latest" version)"
            if [[ "$latest_version" != "$PACKAGE_VERSION" ]]; then
              echo "::error::npm latest points to $latest_version instead of $PACKAGE_VERSION"
              exit 1
            fi
          fi

          echo "stage_id=$stage_id" >> "$GITHUB_OUTPUT"

      - name: Create or update the latest GitHub Release
        if: steps.npm_plan.outputs.plan == 'publish' || steps.npm_plan.outputs.plan == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ needs.prepare.outputs.notes_file }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          published_notes="$RUNNER_TEMP/release-notes.md"
          awk '
            /^> Draft GitHub Release notes\./ { next }
            /^## Package and release checklist$/ { exit }
            { print }
          ' "$RELEASE_NOTES_FILE" > "$published_notes"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Svelix $RELEASE_TAG" \
              --notes-file "$published_notes" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Svelix $RELEASE_TAG" \
              --notes-file "$published_notes" \
              --latest
          fi

      - name: Record release result
        if: steps.npm_plan.outputs.plan == 'publish' || steps.npm_plan.outputs.plan == 'resume'
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "## Released $RELEASE_TAG"
            echo
            echo "- npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION"
            echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record staged first release
        if: steps.npm_plan.outputs.plan == 'stage' || steps.npm_plan.outputs.plan == 'await-approval'
        env:
          PACKAGE_SHASUM: ${{ needs.verify.outputs.package_shasum }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PROVENANCE_PLAN: ${{ steps.npm_plan.outputs.provenance }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          STAGE_ID: ${{ steps.npm_action.outputs.stage_id }}
        run: |
          {
            echo "## Staged $PACKAGE_NAME@$PACKAGE_VERSION"
            echo
            echo "- Stage ID: \`$STAGE_ID\`"
            echo "- Package SHA-1: \`$PACKAGE_SHASUM\`"
            if [[ "$PROVENANCE_PLAN" == "omit-bootstrap-recovery" ]]; then
              echo "- Provenance: omitted for this bootstrap recovery because the immutable tag source differs from the workflow identity commit."
            fi
            echo "- Review and approve the staged package with 2FA on npmjs.com."
            echo "- After approval, configure trusted publishing and remove NPM_TOKEN."
            echo "- Rerun this workflow from main with operation release to create the GitHub Release for $RELEASE_TAG."
          } >> "$GITHUB_STEP_SUMMARY"
