name: Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE to tag and publish the package
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      notes_file: ${{ steps.release.outputs.notes_file }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version, tag, and main ancestry
        id: release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node --print "require('./package.json').name")"
          repository_url="$(node --print "require('./package.json').repository.url")"
          version="$(node --print "require('./package.json').version")"
          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$package_name" != "svelix" ]]; then
            echo "::error::Expected package name svelix, received $package_name"
            exit 1
          fi

          if [[ "$repository_url" != "git+https://github.com/Saku0512/Svelix.git" ]]; then
            echo "::error::package.json repository URL does not match the trusted GitHub repository"
            exit 1
          fi

          if [[ ! "$version" =~ $stable_semver ]]; then
            echo "::error::Release workflow only accepts stable MAJOR.MINOR.PATCH versions, received $version"
            exit 1
          fi

          tag="v${version}"
          notes_file="docs/releases/${tag}.md"
          source_sha="$(git rev-parse HEAD)"

          if [[ ! -f "$notes_file" ]]; then
            echo "::error::Missing release notes: $notes_file"
            exit 1
          fi

          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --tags origin

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$CONFIRMATION" != "RELEASE" ]]; then
              echo "::error::Manual releases require confirmation value RELEASE"
              exit 1
            fi

            if [[ "$GIT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run from main, received $GIT_REF"
              exit 1
            fi

            if [[ "$source_sha" != "$(git rev-parse origin/main)" ]]; then
              echo "::error::The selected revision is not the current origin/main tip"
              exit 1
            fi
          else
            if [[ "$GIT_REF_NAME" != "$tag" ]]; then
              echo "::error::Git tag $GIT_REF_NAME does not match package version $version"
              exit 1
            fi

            if ! git merge-base --is-ancestor "$source_sha" origin/main; then
              echo "::error::Tag $tag does not point to a commit contained in main"
              exit 1
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$source_sha" ]]; then
              echo "::error::Existing tag $tag points to $tag_sha instead of $source_sha"
              exit 1
            fi
          fi

          {
            echo "package_name=$package_name"
            echo "version=$version"
            echo "tag=$tag"
            echo "source_sha=$source_sha"
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Svelte and TypeScript
        run: npm run check

      - name: Build distributable package
        run: npm run build

      - name: Run release test suite
        run: npm test

      - name: Verify clean and reproducible package build
        run: npm run test:package:clean

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Review package archive
        run: npm pack --dry-run --json --ignore-scripts

  release:
    name: Tag and publish release
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/svelix/v/${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js 24 LTS and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify npm trusted-publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error('npm 11.5.1 or newer is required for trusted publishing'); process.exit(1); }" "$npm_version"

      - name: Build publishable package
        run: npm run build

      - name: Create or verify immutable release tag
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG points to $tag_sha instead of $EXPECTED_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$EXPECTED_SHA" --message "Svelix $RELEASE_TAG"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish package with provenance and latest tag
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          pack_json="$RUNNER_TEMP/npm-pack.json"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$pack_json"

          tarball_filename="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const entry=Array.isArray(data)?data[0]:data[Object.keys(data)[0]];process.stdout.write(entry.filename)" "$pack_json")"
          local_integrity="$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const entry=Array.isArray(data)?data[0]:data[Object.keys(data)[0]];process.stdout.write(entry.integrity)" "$pack_json")"
          tarball="$RUNNER_TEMP/$tarball_filename"
          package_spec="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          npm_error_file="$RUNNER_TEMP/npm-view-error.log"

          set +e
          registry_json="$(npm view "$package_spec" dist.integrity --json 2> "$npm_error_file")"
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            registry_integrity="$(node -e "process.stdout.write(JSON.parse(process.argv[1]))" "$registry_json")"
            if [[ "$registry_integrity" != "$local_integrity" ]]; then
              echo "::error::$package_spec already exists with different package integrity"
              exit 1
            fi
            echo "$package_spec is already published with matching integrity; skipping npm publish."
          else
            npm_error="$(<"$npm_error_file")"
            if [[ "$npm_error" != *"E404"* && "$registry_json" != *"E404"* ]]; then
              printf '%s\n' "$npm_error" >&2
              printf '%s\n' "$registry_json" >&2
              exit "$view_status"
            fi

            if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
              NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm publish "$tarball" --access public --tag latest --provenance
            else
              npm publish "$tarball" --access public --tag latest --provenance
            fi
          fi

          latest_version="$(npm view "${PACKAGE_NAME}@latest" version)"
          if [[ "$latest_version" != "$PACKAGE_VERSION" ]]; then
            echo "::error::npm latest points to $latest_version instead of $PACKAGE_VERSION"
            exit 1
          fi

      - name: Create or update the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ needs.prepare.outputs.notes_file }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          published_notes="$RUNNER_TEMP/release-notes.md"
          awk '
            /^> Draft GitHub Release notes\./ { next }
            /^## Package and release checklist$/ { exit }
            { print }
          ' "$RELEASE_NOTES_FILE" > "$published_notes"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Svelix $RELEASE_TAG" \
              --notes-file "$published_notes" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Svelix $RELEASE_TAG" \
              --notes-file "$published_notes" \
              --latest
          fi

      - name: Record release result
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "## Released $RELEASE_TAG"
            echo
            echo "- npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION"
            echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
