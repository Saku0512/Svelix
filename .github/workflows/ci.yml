name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release_v*'

permissions:
  contents: read

jobs:
  verify:
    name: Check, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check whitespace on Svelix sources and docs
        if: github.event_name == 'pull_request'
        run: |
          git diff --check "origin/${{ github.base_ref }}...HEAD" -- src tests README.md AGENTS.md package.json tsconfig.json .github

      - name: Type-check Svelte and TypeScript
        run: npm run check

      - name: Build distributable package
        run: npm run build

      - name: Verify Chrome binary
        run: |
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Run theme, component, accessibility, SSR/hydration, bundle, and consumer checks
        run: npm test

      - name: Run clean install and reproducible build check
        run: npm run test:package:clean
